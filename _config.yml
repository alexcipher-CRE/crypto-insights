title: Crypto Insights
description: Automated crypto market analysis — trending coins, DeFi yields, and protocol deep dives.
baseurl: "/crypto-insights"
url: "https://alexcipher-cre.github.io"
permalink: /:year/:month/:day/:title.html
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

author:
  name: Alex Cipher
  twitter: alexcipher
  github: superorastudio

# SEO
twitter:
  username: alexcipher
  card: summary_large_image

social:
  name: Alex Cipher
  links:
    - https://twitter.com/alexcipher
    - https://github.com/superorastudio

# Google Analytics (disabled - no tracking)
google_analytics:

# Google Analytics (empty - no tracking)
ga: 

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - vendor
