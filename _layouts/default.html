<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="Alex Cipher">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{{ page.layout | default: 'website' }}">
    <meta property="og:url" content="{{ page.url | absolute_url | default: site.url }}">
    <meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/og-image.png' | absolute_url }}">
    <meta name="twitter:site" content="@alexcipher">
    
    <!-- SEO -->
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ page.url | absolute_url | default: site.url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ '/feed.xml' | relative_url }}">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | relative_url }}">
    
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{{ '/' | relative_url }}">🔮 {{ site.title }}</a></h1>
            <p>{{ site.description }}</p>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/archive' | relative_url }}">Archive</a>
                <a href="{{ '/about' | relative_url }}">About</a>
                <a href="{{ '/newsletter' | relative_url }}">📬 Newsletter</a>
                <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} | 
                Powered by <a href="https://github.com/superorastudio/crypto-insights">open-source automation</a> | 
                <small>Affiliate links included. Not financial advice.</small>
            </p>
        </div>
    </footer>
</body>
</html>
