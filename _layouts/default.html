<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{{ '/' | relative_url }}">🔮 {{ site.title }}</a></h1>
            <p>{{ site.description }}</p>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/archive' | relative_url }}">Archive</a>
                <a href="{{ '/about' | relative_url }}">About</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} | 
                Powered by <a href="https://github.com/superorastudio/crypto-insights">open-source automation</a> | 
                <small>Affiliate links included. Not financial advice.</small>
            </p>
        </div>
    </footer>
</body>
</html>
